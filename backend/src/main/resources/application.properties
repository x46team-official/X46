spring.application.name=x46-backend

spring.datasource.url=jdbc:postgresql://localhost:5434/x46
spring.datasource.username=x46
spring.datasource.password=x46

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8081

security.jwt.secret=dev-only-change-me-x46-lims-jwt-signing-secret-rotate-before-prod
security.jwt.expiration-minutes=60

# Comma-separated origins allowed to call this API. Add the deployed Vercel
# frontend URL here once it exists. localhost:3000 is Next.js's actual dev
# port (the frontend/ app); 5173 kept too in case a Vite tool is ever added.
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173